<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农场背包 + 商店 Demo (1280×720)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0e1322;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #fff; user-select: none; overflow: auto;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* 游戏视口 1280×720 */
  #stage {
    position: relative; width: 1280px; height: 720px; flex: 0 0 auto;
    background: linear-gradient(180deg, #bfe9ff 0%, #a6e08a 52%, #6cbf4e 100%);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  }
  #stage::before {
    content: ""; position: absolute; top: 46px; left: 80px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff6c8 0%, #ffe27a 60%, rgba(255,226,122,0) 72%);
    pointer-events: none;
  }
  #stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 180px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 40px, rgba(0,0,0,.04) 40px 80px);
    pointer-events: none;
  }

  .gold-hud {
    position: absolute; top: 18px; left: 18px; z-index: 6;
    background: rgba(20,30,12,.62); border: 2px solid #ffe9b0;
    color: #ffe9b0; font-weight: 800; font-size: 18px;
    padding: 8px 16px; border-radius: 22px;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 6px;
  }

  .open-btn {
    position: absolute; right: 36px; bottom: 36px; z-index: 5;
    width: 92px; height: 92px; border-radius: 50%;
    border: 4px solid #ffe9b0;
    background: linear-gradient(180deg, #7bc043, #4e8a2a);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 2px 8px rgba(255,255,255,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .12s ease;
  }
  .open-btn:active { transform: scale(.92); }
  .open-btn .emo { font-size: 30px; }

  .shop-btn {
    position: absolute; left: 36px; bottom: 36px; z-index: 5;
    width: 92px; height: 92px; border-radius: 50%;
    border: 4px solid #ffe9b0;
    background: linear-gradient(180deg, #f0a93d, #cf7a1e);
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 2px 8px rgba(255,255,255,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .12s ease;
  }
  .shop-btn:active { transform: scale(.92); }
  .shop-btn .emo { font-size: 30px; }

  .toast {
    position: absolute; top: 90px; left: 50%; transform: translate(-50%, -10px);
    background: rgba(20,30,12,.92); color: #ffe9b0; border: 2px solid #ffe9b0;
    padding: 10px 22px; border-radius: 24px; font-size: 16px; font-weight: 700;
    z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: absolute; inset: 0; background: rgba(8,20,10,.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .overlay.show { display: flex; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .panel {
    width: 680px; max-width: 94vw;
    background: linear-gradient(180deg, #5a7a33, #38521f);
    border: 3px solid #d9b56a; border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.06);
    display: flex; flex-direction: column; overflow: hidden;
    animation: pop .22s cubic-bezier(.2,1.3,.5,1);
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 22px;
    border-bottom: 2px solid rgba(217,181,106,.5);
    background: linear-gradient(180deg, rgba(255,233,176,.14), rgba(255,233,176,0));
  }
  .panel-title { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #ffe9b0; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
  .close-btn {
    width: 36px; height: 36px; border-radius: 9px;
    border: 2px solid #ffb3b3; background: #5a2733; color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .close-btn:active { transform: scale(.9); }

  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 18px; background: rgba(0,0,0,.22);
    border-bottom: 1px solid rgba(217,181,106,.35); flex-wrap: wrap;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 7px 16px; border-radius: 18px; border: 2px solid rgba(217,181,106,.55);
    background: rgba(0,0,0,.2); color: #f3e8cf; font-size: 14px; cursor: pointer; transition: all .12s;
  }
  .tab:hover { border-color: #ffe9b0; }
  .tab.active { background: #d9b56a; color: #3a2a12; border-color: #d9b56a; font-weight: 700; }

  .sort { display: flex; align-items: center; gap: 8px; }
  .sort-label { font-size: 12px; color: #d7c79a; }
  .sort-btn {
    padding: 6px 12px; border-radius: 14px; border: 2px solid rgba(217,181,106,.45);
    background: rgba(0,0,0,.18); color: #f3e8cf; font-size: 13px; cursor: pointer; transition: all .12s; min-width: 64px; text-align: center;
  }
  .sort-btn:hover { border-color: #ffe9b0; }
  .sort-btn.active { background: rgba(217,181,106,.28); border-color: #ffe9b0; color: #ffe9b0; font-weight: 700; }

  .scroll-view { height: 372px; overflow-y: auto; overflow-x: hidden; padding: 18px; scrollbar-width: thin; scrollbar-color: #d9b56a transparent; }
  .scroll-view::-webkit-scrollbar { width: 12px; }
  .scroll-view::-webkit-scrollbar-track { background: rgba(0,0,0,.22); border-radius: 8px; margin: 6px 0; }
  .scroll-view::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#ffe9b0,#d9b56a); border-radius: 8px; border: 3px solid #2f4419; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }

  .cell {
    aspect-ratio: 1 / 1; background: linear-gradient(180deg, #f5ecd4, #e6d4ab);
    border: 2px solid #b89b63; border-radius: 12px; position: relative;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .1s ease, border-color .1s ease, box-shadow .1s ease;
  }
  .cell:hover { border-color: #d9b56a; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .cell .icon { font-size: 36px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .cell .name { position: absolute; left: 0; right: 0; top: 5px; text-align: center; font-size: 11px; color: #5b4422; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; pointer-events: none; }
  .cell .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; pointer-events: none; }
  .cell .count { font-size: 13px; font-weight: 700; color: #3a2a12; text-shadow: 0 1px 1px rgba(255,255,255,.5); }
  .cell .sell {
    pointer-events: auto; font-size: 11px; font-weight: 700; color: #8a4b13;
    background: rgba(255,233,176,.75); border: 1px solid #d9b56a; border-radius: 8px; padding: 1px 6px; cursor: pointer;
  }
  .cell .sell:hover { background: #ffe9b0; }
  .empty { grid-column: 1 / -1; text-align: center; color: #e9dcb8; padding: 40px 0; font-size: 14px; }

  .shop-item {
    aspect-ratio: 1 / 1; background: linear-gradient(180deg, #f5ecd4, #e6d4ab);
    border: 2px solid #b89b63; border-radius: 12px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px;
  }
  .shop-item .icon { font-size: 32px; }
  .shop-item .name { font-size: 12px; color: #5b4422; font-weight: 600; text-align: center; }
  .shop-item .price { font-size: 13px; font-weight: 700; color: #3a2a12; }
  .shop-item .price.poor { color: #c0392b; }
  .shop-item .resale { font-size: 10px; color: #8a7a55; }
  .buy-btn { margin-top: 2px; padding: 4px 16px; border-radius: 12px; border: 2px solid #4e8a2a; background: #6cbf4e; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .buy-btn:hover { background: #5aa83f; }
  .buy-btn:disabled { background: #b9b59f; border-color: #999; cursor: not-allowed; opacity: .7; }

  .panel-footer { padding: 11px 22px; border-top: 2px solid rgba(217,181,106,.3); font-size: 13px; color: #efe2c0; display: flex; justify-content: space-between; gap: 12px; }
  .panel-footer .hint { color: #c9b484; }
</style>
</head>
<body>
  <div id="stage">
    <div class="gold-hud">💰 <span id="goldVal">500</span></div>
    <button class="shop-btn" id="shopBtn"><span class="emo">🛒</span>商店</button>
    <button class="open-btn" id="openBtn"><span class="emo">🧺</span>背包</button>
    <div class="toast" id="toast"></div>

    <!-- 背包面板 -->
    <div class="overlay" id="overlay">
      <div class="panel" role="dialog" aria-label="农场背包">
        <div class="panel-header">
          <div class="panel-title">农 场 背 包</div>
          <button class="close-btn" id="closeBtn" title="关闭">×</button>
        </div>
        <div class="toolbar">
          <div class="tabs">
            <div class="tab active" data-cat="all">全部</div>
            <div class="tab" data-cat="seed">种子</div>
            <div class="tab" data-cat="fruit">果实</div>
            <div class="tab" data-cat="fert">化肥</div>
          </div>
          <div class="sort">
            <span class="sort-label">排序</span>
            <div class="sort-btn active" data-sort="time">时间 ↓</div>
            <div class="sort-btn" data-sort="name">名称</div>
          </div>
        </div>
        <div class="scroll-view" id="scrollView">
          <div class="grid" id="grid"></div>
        </div>
        <div class="panel-footer">
          <span id="footer">共 0 件物品</span>
          <span class="hint">点格子看详情 · 点「卖💰」出售 · 可上下滑动</span>
        </div>
      </div>
    </div>

    <!-- 商店面板 -->
    <div class="overlay" id="shopOverlay">
      <div class="panel" role="dialog" aria-label="农场商店">
        <div class="panel-header">
          <div class="panel-title">农 场 商 店</div>
          <button class="close-btn" id="shopCloseBtn" title="关闭">×</button>
        </div>
        <div class="toolbar">
          <div class="tabs">
            <div class="tab active" data-cat="seed">种子</div>
            <div class="tab" data-cat="fert">化肥</div>
          </div>
          <div class="sort-label">仅售 种子 / 化肥</div>
        </div>
        <div class="scroll-view" id="shopScrollView">
          <div class="grid" id="shopGrid"></div>
        </div>
        <div class="panel-footer">
          <span id="shopFooter">金币：0</span>
          <span class="hint">点「购买」放入背包 · 售价=回收价×2</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const SEED = [
    {name:'小麦种子',icon:'🌾'},{name:'水稻种子',icon:'🌾'},{name:'玉米种子',icon:'🌽'},
    {name:'胡萝卜种子',icon:'🥕'},{name:'番茄种子',icon:'🍅'},{name:'土豆种子',icon:'🥔'},
    {name:'草莓种子',icon:'🍓'},{name:'南瓜种子',icon:'🎃'},{name:'辣椒种子',icon:'🌶️'},
    {name:'茄子种子',icon:'🍆'},{name:'西瓜种子',icon:'🍉'},{name:'向日葵种子',icon:'🌻'},
    {name:'蓝莓种子',icon:'🫐'},{name:'葡萄种子',icon:'🍇'},{name:'大豆种子',icon:'🫛'},
    {name:'花生种子',icon:'🥜'},{name:'洋葱种子',icon:'🧅'},{name:'大蒜种子',icon:'🧄'},
    {name:'菠菜种子',icon:'🥬'},{name:'生菜种子',icon:'🥗'},{name:'棉花种子',icon:'🌿'}
  ];
  const FRUIT = [
    {name:'小麦',icon:'🌾'},{name:'水稻',icon:'🌾'},{name:'玉米',icon:'🌽'},
    {name:'胡萝卜',icon:'🥕'},{name:'番茄',icon:'🍅'},{name:'土豆',icon:'🥔'},
    {name:'草莓',icon:'🍓'},{name:'南瓜',icon:'🎃'},{name:'辣椒',icon:'🌶️'},
    {name:'茄子',icon:'🍆'},{name:'西瓜',icon:'🍉'},{name:'苹果',icon:'🍎'},
    {name:'蓝莓',icon:'🫐'},{name:'葡萄',icon:'🍇'},{name:'橙子',icon:'🍊'},
    {name:'柠檬',icon:'🍋'},{name:'桃子',icon:'🍑'},{name:'椰子',icon:'🥥'},
    {name:'香蕉',icon:'🍌'},{name:'菠萝',icon:'🍍'},{name:'芒果',icon:'🥭'},
    {name:'杨梅',icon:'🍒'},{name:'柿子',icon:'🥮'},{name:'猕猴桃',icon:'🥝'},
    {name:'哈密瓜',icon:'🍈'},{name:'大豆',icon:'🫛'},{name:'花生',icon:'🥜'}
  ];
  const FERT = [
    {name:'有机肥',icon:'💩'},{name:'复合肥',icon:'🧪'},{name:'氮肥',icon:'🟦'},
    {name:'磷肥',icon:'🟧'},{name:'钾肥',icon:'🟪'},{name:'营养液',icon:'🧴'},
    {name:'堆肥',icon:'🍂'},{name:'骨粉',icon:'🦴'},{name:'草木灰',icon:'🌫️'},
    {name:'缓释肥',icon:'⏳'},{name:'鱼蛋白',icon:'🐟'},{name:'海藻肥',icon:'🌿'}
  ];

  function valueFor(cat, i) {
    if (cat === 'seed') return 6 + ((i * 5 + 3) % 17);
    if (cat === 'fruit') return 18 + ((i * 7 + 5) % 37);
    return 10 + ((i * 3 + 2) % 23);
  }
  const BUY_MULT = 2;
  const CAT_LABEL = { all:'全部', seed:'种子', fruit:'果实', fert:'化肥' };
  const SORT_LABEL = { time:'时间', name:'名称' };
  let nextId = 0;
  const INVENTORY = (() => {
    const defs = [
      ...SEED.map((s, i) => ({ ...s, category:'seed', value: valueFor('seed', i) })),
      ...FRUIT.map((f, i) => ({ ...f, category:'fruit', value: valueFor('fruit', i) })),
      ...FERT.map((f, i) => ({ ...f, category:'fert', value: valueFor('fert', i) })),
    ];
    const now = Date.now();
    return defs.map((d, i) => ({
      id: i, ...d,
      count: ((i * 7 + 3) % 12) + 1,
      acquired: now - (i * 5 + (i % 6) * 9 + 2) * 3600 * 1000,
    }));
  })();
  nextId = INVENTORY.length;
  const SHOP_ITEMS = [
    ...SEED.map((s, i) => ({ ...s, category:'seed', value: valueFor('seed', i) })),
    ...FERT.map((f, i) => ({ ...f, category:'fert', value: valueFor('fert', i) })),
  ].map(d => ({ ...d, price: d.value * BUY_MULT }));

  let gold = 500;
  function setGold(v) { gold = Math.max(0, v); document.getElementById('goldVal').textContent = gold; }
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
  }
  function timeAgo(ts) {
    const h = Math.floor((Date.now() - ts) / 3600000);
    if (h < 1) return '刚刚';
    if (h < 24) return h + '小时前';
    return Math.floor(h / 24) + '天前';
  }

  const bpState = { category: 'all', sortKey: 'time', sortDir: 'desc' };
  const overlay = document.getElementById('overlay');
  const grid = document.getElementById('grid');
  const footer = document.getElementById('footer');

  function applyView() {
    let list = INVENTORY.slice();
    if (bpState.category !== 'all') list = list.filter(i => i.category === bpState.category);
    if (bpState.sortKey === 'time') {
      list.sort((a, b) => bpState.sortDir === 'desc' ? b.acquired - a.acquired : a.acquired - b.acquired);
    } else {
      list.sort((a, b) => {
        const r = a.name.localeCompare(b.name, 'zh-Hans-CN');
        return bpState.sortDir === 'desc' ? -r : r;
      });
    }
    return list;
  }

  function renderCells() {
    const list = applyView();
    grid.innerHTML = '';
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">该分类下暂无物品</div>';
    } else {
      list.forEach(it => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.title = `${it.name} x${it.count} · ${CAT_LABEL[it.category]} · 回收价💰${it.value} · 获得于${timeAgo(it.acquired)}`;
        cell.innerHTML = `
          <div class="name">${it.name}</div>
          <div class="icon">${it.icon}</div>
          <div class="foot"><span class="count">x${it.count}</span><span class="sell" title="按回收价出售 1 个">卖💰${it.value}</span></div>`;
        cell.addEventListener('click', () => alert(`【${CAT_LABEL[it.category]}】${it.name} × ${it.count}\n回收价：💰 ${it.value} / 个\n（当前金币 ${gold}）`));
        cell.querySelector('.sell').addEventListener('click', (e) => { e.stopPropagation(); sellOne(it); });
        grid.appendChild(cell);
      });
    }
    footer.innerHTML = `<span>共 ${list.length} 件物品</span>`;
    document.getElementById('scrollView').scrollTop = 0;
  }

  function sellOne(item) {
    const idx = INVENTORY.findIndex(x => x.id === item.id);
    if (idx < 0) return;
    const it = INVENTORY[idx];
    setGold(gold + it.value);
    showToast(`+${it.value} 💰 出售 ${it.name}`);
    it.count -= 1;
    if (it.count <= 0) INVENTORY.splice(idx, 1);
    renderCells();
  }

  function updateSortArrows() {
    overlay.querySelectorAll('.sort-btn').forEach(x => {
      const key = x.dataset.sort;
      const arrow = (bpState.sortKey === key) ? (bpState.sortDir === 'desc' ? ' ↓' : ' ↑') : '';
      x.textContent = SORT_LABEL[key] + arrow;
    });
  }

  overlay.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      bpState.category = t.dataset.cat;
      overlay.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
      renderCells();
    });
  });
  overlay.querySelectorAll('.sort-btn').forEach(b => {
    b.addEventListener('click', () => {
      const key = b.dataset.sort;
      if (bpState.sortKey === key) bpState.sortDir = bpState.sortDir === 'desc' ? 'asc' : 'desc';
      else { bpState.sortKey = key; bpState.sortDir = 'desc'; }
      overlay.querySelectorAll('.sort-btn').forEach(x => x.classList.toggle('active', x.dataset.sort === bpState.sortKey));
      updateSortArrows();
      renderCells();
    });
  });

  function openBackpack() { renderCells(); overlay.classList.add('show'); }
  function closeBackpack() { overlay.classList.remove('show'); }
  document.getElementById('openBtn').addEventListener('click', openBackpack);
  document.getElementById('closeBtn').addEventListener('click', closeBackpack);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeBackpack(); });

  const shopState = { cat: 'seed' };
  const shopOverlay = document.getElementById('shopOverlay');
  const shopGrid = document.getElementById('shopGrid');
  const shopFooter = document.getElementById('shopFooter');

  function renderShop() {
    const list = SHOP_ITEMS.filter(d => d.category === shopState.cat);
    shopGrid.innerHTML = '';
    list.forEach(def => {
      const can = gold >= def.price;
      const el = document.createElement('div');
      el.className = 'shop-item';
      el.innerHTML = `
        <div class="icon">${def.icon}</div>
        <div class="name">${def.name}</div>
        <div class="price ${can ? '' : 'poor'}">💰 ${def.price}</div>
        <div class="resale">回收💰${def.value}</div>
        <button class="buy-btn" ${can ? '' : 'disabled'}>购买</button>`;
      el.querySelector('.buy-btn').addEventListener('click', () => buyOne(def));
      shopGrid.appendChild(el);
    });
    shopFooter.textContent = `金币：${gold} 💰  ·  在售 ${list.length} 种`;
  }

  function buyOne(def) {
    if (gold < def.price) { showToast('金币不足 💰'); return; }
    setGold(gold - def.price);
    showToast(`-${def.price} 💰 购买 ${def.name}`);
    const exist = INVENTORY.find(x => x.name === def.name && x.category === def.category);
    if (exist) exist.count += 1;
    else INVENTORY.push({ id: nextId++, name: def.name, icon: def.icon, category: def.category, value: def.value, count: 1, acquired: Date.now() });
    renderShop();
  }

  shopOverlay.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      shopState.cat = t.dataset.cat;
      shopOverlay.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
      renderShop();
    });
  });

  function openShop() { renderShop(); shopOverlay.classList.add('show'); }
  function closeShop() { shopOverlay.classList.remove('show'); }
  document.getElementById('shopBtn').addEventListener('click', openShop);
  document.getElementById('shopCloseBtn').addEventListener('click', closeShop);
  shopOverlay.addEventListener('click', e => { if (e.target === shopOverlay) closeShop(); });

  setGold(500);
  updateSortArrows();
</script>
</body>
</html>
