<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云农场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* 背景全屏填充 */
  body {
    background: url("farm/bg_ground.png") center / cover no-repeat fixed #2c3e2c;
    cursor: default;
  }

  /* a 土地网格 —— 可拖动调整位置 */
  #field {
    position: absolute;
    left: 0;
    top: 0;
    /* 初始居中，之后靠拖动移动 */
    width: 1200px;  /* 6 * 200 */
    height: 800px;  /* 4 * 200 */
    display: grid;
    grid-template-columns: repeat(6, 200px);
    grid-auto-rows: 200px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  #field.dragging { cursor: grabbing; }

  .plot {
    position: relative;
    width: 200px;
    height: 200px;
  }
  .plot img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="field"></div>

<script>
(function () {
  // 目前只排 a 土地（正常土块）。b / c / d 后续只是替换到对应 a 位置上。
  const COLS = 6, ROWS = 4, TILE = 200;

  const field = document.getElementById('field');

  // 初始位置：居中
  field.style.left = Math.round((window.innerWidth - COLS * TILE) / 2) + 'px';
  field.style.top = Math.round((window.innerHeight - ROWS * TILE) / 2) + 'px';

  // 生成 a 土地：位置 1..6 按 6 列排布，复制成 4 行
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const position = c + 1;
      const plot = document.createElement('div');
      plot.className = 'plot';
      const img = document.createElement('img');
      img.src = `farm/lands_a/locked_${position}a.png`;
      img.alt = 'a' + position;
      plot.appendChild(img);
      field.appendChild(plot);
    }
  }

  // 拖动整个 a 土地网格来调整位置
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;

  field.addEventListener('pointerdown', (e) => {
    dragging = true;
    field.classList.add('dragging');
    sx = e.clientX; sy = e.clientY;
    ox = field.offsetLeft; oy = field.offsetTop;
    field.setPointerCapture(e.pointerId);
  });

  field.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    field.style.left = (ox + e.clientX - sx) + 'px';
    field.style.top = (oy + e.clientY - sy) + 'px';
  });

  const end = () => {
    dragging = false;
    field.classList.remove('dragging');
  };
  field.addEventListener('pointerup', end);
  field.addEventListener('pointercancel', end);
})();
</script>
</body>
</html>
